name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Stats cards run before snk: snk runs in Docker as root and makes dist/ unwritable.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&card_width=495&theme=tokyonight&title_color=38BDF8&icon_color=38BDF8&text_color=94A3B8&hide_border=true
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=495&theme=tokyonight&title_color=38BDF8&text_color=94A3B8&hide_border=true
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Pad cards to 495x195 so they match the streak card in the README.
      - name: Normalize card height
        shell: python
        run: |
          import re, pathlib
          for name in ("stats.svg", "top-langs.svg"):
              p = pathlib.Path("dist") / name
              svg = p.read_text()
              tag = re.search(r"<svg\b[^>]*>", svg).group(0)
              h = int(float(re.search(r'\bheight="([\d.]+)"', tag).group(1)))
              if h < 195:
                  new = re.sub(r'\bheight="[\d.]+"', 'height="195"', tag, count=1)
                  new = re.sub(r'viewBox="0 0 ([\d.]+) [\d.]+"', r'viewBox="0 0 \1 195"', new, count=1)
                  p.write_text(svg.replace(tag, new, 1))

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # High-contrast palettes: eaten cells revert to the first (empty) color.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F59E0B&color_dots=#E2E8F0,#7DD3FC,#38BDF8,#0284C7,#075985
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FACC15&color_dots=#1E293B,#0369A1,#0EA5E9,#38BDF8,#BAE6FD

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
